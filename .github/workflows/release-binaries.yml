name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            artifact_name: celestial-linux-x64
            binary_name: celestial
          - os: macos-latest
            arch: arm64
            artifact_name: celestial-darwin-arm64
            binary_name: celestial
          - os: macos-13
            arch: x64
            artifact_name: celestial-darwin-x64
            binary_name: celestial
          - os: windows-latest
            arch: x64
            artifact_name: celestial-windows-x64
            binary_name: celestial.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run preview:build

      - name: Build Standalone Executable (SEA)
        run: node scripts/bundle-sea.mjs examples/celestial-showcase/src/index.ts ${{ matrix.binary_name }}

      - name: Archive Binary
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "release-artifacts/${{ matrix.artifact_name }}.zip" ./dist-bin/${{ matrix.binary_name }}
          else
            chmod +x ./dist-bin/${{ matrix.binary_name }}
            tar -czvf "release-artifacts/${{ matrix.artifact_name }}.tar.gz" -C ./dist-bin ${{ matrix.binary_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*

  publish-release:
    name: Publish Release Assets
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
