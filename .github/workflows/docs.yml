name: Docs site

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22

jobs:
  build:
    name: Typecheck snippets and generate previews
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run preview:build
      - run: pnpm --filter docs-site exec tsc --noEmit
      - run: pnpm --filter docs-site generate

      # Stage only the static site (docs-site also holds sources, snippets and
      # workspace node_modules, which must not be published).
      - run: |
          mkdir -p dist-site
          cp docs-site/index.html docs-site/style.css docs-site/app.js docs-site/previews.js dist-site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
