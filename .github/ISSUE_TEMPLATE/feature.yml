name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Include API sketches if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
  - type: dropdown
    id: package
    attributes:
      label: Related Package
      options:
        - nebula (core runtime)
        - corona (styling/themes)
        - aurora (animation)
        - constellation (components)
        - horizon (window management)
        - gravity (layout)
        - nexus (mouse/input)
        - core (recommended facade)
        - ui (curated components)
        - test (testing utilities)
        - Other / Multiple
    validations:
      required: true
