name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work? Include API sketches if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
  - type: dropdown
    id: package
    attributes:
      label: Related Package
      options:
        - '@celestial/core (recommended facade)'
        - '@celestial/nebula (runtime)'
        - '@celestial/ui (components)'
        - '@celestial/corona (styling/themes)'
        - '@celestial/aurora (animation)'
        - '@celestial/atlas (capabilities)'
        - '@celestial/rosetta (text/locale)'
        - '@celestial/gravity (layout)'
        - '@celestial/nexus (mouse/input)'
        - '@celestial/compass (navigation)'
        - '@celestial/orbit (forms/wizards)'
        - '@celestial/spectrum (highlighting)'
        - '@celestial/mirage (effects)'
        - '@celestial/nova (transitions)'
        - '@celestial/stellar (charts)'
        - '@celestial/pulsar (markdown)'
        - '@celestial/test (testing)'
        - '@celestial/horizon (windows)'
        - create-celestial (scaffolder)
        - Other / Multiple
    validations:
      required: true
